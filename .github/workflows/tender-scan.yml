name: Daily tender scan

on:
  schedule:
    - cron: "0 6 * * 1-5"
  workflow_dispatch:
    inputs:
      include_awards:
        description: "Also refresh contract awards for the Renewals tab (takes up to an hour)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: tender-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install requests openpyxl cryptography

      - name: Find tenders
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          ALERT_FROM: ${{ secrets.ALERT_FROM }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          SCRIPT=$(find . -name "epl_tender_finder*.py" -not -path "./.git/*" | head -n 1)
          if [ -z "$SCRIPT" ]; then
            echo "Could not find epl_tender_finder.py"
            ls -la
            exit 1
          fi
          AWARDS=""
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%u)" = "1" ]; then
            AWARDS="--awards --award-days 365"
          fi
          if [ "${{ inputs.include_awards }}" = "true" ]; then
            AWARDS="--awards --award-days 365"
          fi
          cd "$(dirname "$SCRIPT")"
          python "$(basename "$SCRIPT")" --days 45 --site-dir "$GITHUB_WORKSPACE/docs" --email $AWARDS

      - name: Save results
        run: |
          git config user.name "tender-finder-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs
          git diff --staged --quiet || git commit -m "Tender scan $(date -u +%Y-%m-%d)"
          git push
